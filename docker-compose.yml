services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: proyecto_academico:prod
    container_name: django_app
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy  # 👈 Espera a que la BD esté realmente lista
    restart: unless-stopped
    
    # Volúmenes para persistencia
    volumes:
      - logs_volume:/app/logs
      - static_volume:/vol/static
      - media_volume:/vol/media
    
    # Healthcheck mejorado
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/admin/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s  # Django tarda en iniciar con migraciones
    
    # Variables de entorno adicionales (opcional)
    environment:
      - DJANGO_SETTINGS_MODULE=proyecto_academico.settings
      - PYTHONUNBUFFERED=1

  db:
    image: postgres:15-alpine  # 👈 Versión más liviana
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      # Configuraciones de rendimiento
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=es_CO.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups  # 👈 Para backups manuales
    
    # Healthcheck para la BD
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    
    # En producción NO expongas este puerto
    # ports:
    #   - "5432:5432"

volumes:
  postgres_data:
    driver: local
  static_volume:
  media_volume:
  logs_volume:

