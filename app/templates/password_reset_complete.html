<!-- templates/password_reset_complete.html -->
{% extends 'base.html' %}
{% block content %}
<br>
<br>

<div class="container">
    <div class="dashboard-header">
        <h2><i class="fas fa-lock"></i> Contraseña Restablecida</h2>
        <p>Tu contraseña ha sido actualizada con éxito</p>
    </div>

    <div class="card">
        <div class="card-header">
            <h3><i class="fas fa-check-circle"></i> Restablecimiento Completado</h3>
        </div>
        <div class="card-body">
            <div class="alert alert-success">
                <i class="fas fa-info-circle"></i>
                <div>
                    <strong>¡Éxito!</strong>
                    <p>Tu contraseña ha sido restablecida correctamente. Ahora puedes iniciar sesión con tu nueva contraseña.</p>
                </div>
            </div>
            <div class="form-actions">
                <a href="{% url 'login' %}" class="btn btn-primary">
                    <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
